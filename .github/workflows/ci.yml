name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Yarn
        run: corepack enable

      - name: Install
        run: yarn install --immutable

      - name: Check
        run: yarn check

      - name: Install Playwright browser
        run: yarn playwright install --with-deps chromium

      - name: Smoke test
        run: yarn test:e2e
